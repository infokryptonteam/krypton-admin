<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KRYPTON Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="KRYPTON Admin workspace">
</head>
<body>
  <app-root></app-root>
  <script>
  (function initKryptonCanvas() {
    function run() {
      const canvas = document.getElementById('topographyCanvas');
      if (!canvas) return setTimeout(run, 60);

      const ctx = canvas.getContext('2d');
      let w, h;
      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      let step = 0;
      const lineCount = 18;
      const pointStep = 32;

      function draw() {
        ctx.clearRect(0, 0, w, h);
        step += 0.0065;

        const startY = h * 0.22;
        const totalHeight = h * 0.70;
        const gap = totalHeight / lineCount;

        for (let i = 0; i < lineCount; i++) {
          const baseY = startY + i * gap;
          const progress = i / lineCount;
          const alpha = 0.16 + Math.sin(progress * Math.PI) * 0.28;

          ctx.strokeStyle = `rgba(16, 208, 58, ${alpha})`;
          ctx.lineWidth = i % 3 === 0 ? 1.6 : 0.95;

          ctx.beginPath();
          let started = false;

          for (let x = -40; x <= w + 40; x += pointStep) {
            const wave1 = Math.sin(x * 0.0035 + step + i * 0.22) * 44;
            const wave2 = Math.cos(x * 0.0072 - step * 0.75 + i * 0.16) * 24;
            const wave3 = Math.sin((x + i * 16) * 0.0018 + step * 1.1) * 18;
            const y = baseY + wave1 + wave2 + wave3;

            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }
    run();
  })();
</script>
</body>
</html>
