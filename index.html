<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krypton Business Manager</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            krypton: {
              neon: '#00FF66',       // Electric Neon Krypton Green
              hover: '#00E65C',      // Hover state
              glow: 'rgba(0, 255, 102, 0.4)',
              tint: '#E6FFF0',       // Soft background tint
              border: '#66FFA3',     // Subtle border glow
              dark: '#008033',       // Legible dark text on light backgrounds
            }
          }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .krypton-glow {
      box-shadow: 0 0 18px rgba(0, 255, 102, 0.45);
    }
    .krypton-card-glow {
      box-shadow: 0 4px 20px -2px rgba(0, 255, 102, 0.15);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row antialiased selection:bg-krypton-neon selection:text-slate-950">

  <!-- ================= LOGIN SCREEN ================= -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white border border-slate-200 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
      <!-- Neon Top Accent Stripe -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-krypton-neon shadow-[0_0_12px_#00FF66]"></div>

      <div class="flex items-center space-x-3 mb-6">
        <div class="h-10 w-10 rounded-xl bg-slate-950 text-krypton-neon flex items-center justify-center font-extrabold text-lg krypton-glow">
          K
        </div>
        <div>
          <h2 class="text-xl font-bold text-slate-900">Krypton</h2>
          <p class="text-xs text-slate-500 font-medium">Business Management</p>
        </div>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
          <input type="email" id="authEmail" required placeholder="admin@krypton.com" class="w-full bg-slate-50 border border-slate-300 focus:border-krypton-neon focus:bg-white text-sm px-3.5 py-2.5 rounded-xl text-slate-900 outline-none transition focus:ring-4 focus:ring-krypton-glow" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
          <input type="password" id="authPass" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-300 focus:border-krypton-neon focus:bg-white text-sm px-3.5 py-2.5 rounded-xl text-slate-900 outline-none transition focus:ring-4 focus:ring-krypton-glow" />
        </div>
        <p id="authError" class="text-rose-600 text-xs font-medium hidden"></p>
        <button type="submit" class="w-full py-2.5 bg-krypton-neon hover:bg-krypton-hover text-slate-950 font-bold rounded-xl text-sm transition krypton-glow active:scale-[0.98]">
          Log In
        </button>
      </form>
    </div>
  </div>

  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar" class="w-full md:w-64 bg-white border-r border-slate-200 p-5 flex flex-col justify-between shrink-0 md:min-h-screen">
    <div class="space-y-6">
      
      <!-- Brand Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="h-9 w-9 rounded-xl bg-slate-950 text-krypton-neon font-black flex items-center justify-center text-base krypton-glow">
            K
          </div>
          <div>
            <span class="font-extrabold text-slate-900 text-base leading-none block">Krypton</span>
            <span class="text-[11px] text-slate-400 font-medium">Admin Portal</span>
          </div>
        </div>
        <div class="flex items-center space-x-1 bg-krypton-tint border border-krypton-border px-2 py-0.5 rounded-full">
          <span class="w-1.5 h-1.5 rounded-full bg-krypton-neon animate-pulse shadow-[0_0_6px_#00FF66]"></span>
          <span class="text-[10px] font-bold text-krypton-dark">ACTIVE</span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="space-y-1.5" id="navTabs">
        <button data-tab="clients" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-bold bg-krypton-neon text-slate-950 krypton-glow transition">
          <i data-lucide="users" class="w-4 h-4"></i> <span>Clients</span>
        </button>
        <button data-tab="projects" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="folder" class="w-4 h-4"></i> <span>Projects</span>
        </button>
        <button data-tab="tasks" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="check-square" class="w-4 h-4"></i> <span>Tasks</span>
        </button>
        <button data-tab="recurring" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i> <span>Recurring Clients</span>
        </button>
        <button data-tab="payments" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="credit-card" class="w-4 h-4"></i> <span>Payments</span>
        </button>
        <button data-tab="social" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="share-2" class="w-4 h-4"></i> <span>Social Media</span>
        </button>
        <button data-tab="team" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="user-check" class="w-4 h-4"></i> <span>Team Members</span>
        </button>
        <button data-tab="reports" class="tab-btn w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
          <i data-lucide="bar-chart-2" class="w-4 h-4"></i> <span>Reports</span>
        </button>
      </nav>
    </div>

    <!-- Admin Profile / Logout -->
    <div class="pt-4 border-t border-slate-200 flex items-center justify-between">
      <div class="flex items-center space-x-2.5 truncate">
        <div class="w-8 h-8 rounded-full bg-slate-950 text-krypton-neon font-extrabold text-xs flex items-center justify-center">A</div>
        <div class="truncate">
          <p id="userEmailBadge" class="text-xs font-bold text-slate-800 truncate">admin</p>
          <p class="text-[10px] text-slate-400 font-medium">Manager</p>
        </div>
      </div>
      <button id="logoutBtn" title="Logout" class="p-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>
    </div>
  </aside>

  <!-- ================= MAIN WORKSPACE ================= -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    
    <!-- Top Action Bar -->
    <header class="h-16 border-b border-slate-200 px-6 flex items-center justify-between gap-4 bg-white">
      <div class="relative w-full max-w-sm">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="globalSearch" placeholder="Search clients, projects, tasks..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-4 py-2 text-xs font-medium text-slate-800 placeholder:text-slate-400 focus:border-krypton-neon focus:bg-white outline-none transition focus:ring-4 focus:ring-krypton-glow" />
      </div>

      <div class="flex items-center space-x-3 shrink-0">
        <button id="refreshBtn" class="flex items-center space-x-1.5 px-3.5 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-semibold text-slate-700 transition">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-slate-500" id="refreshIcon"></i>
          <span class="hidden sm:inline">Refresh</span>
        </button>
        <button id="openModalBtn" class="flex items-center space-x-1.5 px-4 py-2 bg-krypton-neon hover:bg-krypton-hover text-slate-950 font-bold rounded-xl text-xs transition krypton-glow active:scale-[0.98]">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span id="newEntryBtnLabel">Add Client</span>
        </button>
      </div>
    </header>

    <!-- Scrollable Workspace -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      
      <!-- STATS PANEL (5 METRICS) -->
      <section class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
        
        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
          <p class="text-xs font-semibold text-slate-500">Total Clients</p>
          <div class="flex items-baseline justify-between mt-2">
            <h3 id="statClients" class="text-2xl font-black text-slate-900 font-mono">0</h3>
            <span class="text-xs font-bold text-krypton-dark bg-krypton-tint px-2 py-0.5 rounded-full border border-krypton-border">Saved</span>
          </div>
        </div>

        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
          <p class="text-xs font-semibold text-slate-500">Active Projects</p>
          <div class="flex items-baseline justify-between mt-2">
            <h3 id="statProjects" class="text-2xl font-black text-slate-900 font-mono">0</h3>
            <span class="text-xs font-semibold text-slate-500">Running</span>
          </div>
        </div>

        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
          <p class="text-xs font-semibold text-slate-500">Pending Tasks</p>
          <div class="flex items-baseline justify-between mt-2">
            <h3 id="statTasks" class="text-2xl font-black text-slate-900 font-mono">0</h3>
            <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">Pending</span>
          </div>
        </div>

        <!-- Highlighted Neon Krypton Subscriptions Card -->
        <div class="bg-krypton-tint border-2 border-krypton-neon p-4 rounded-2xl krypton-card-glow">
          <p class="text-xs font-extrabold text-krypton-dark uppercase tracking-wider">Monthly Subscriptions</p>
          <div class="flex items-baseline justify-between mt-2">
            <h3 id="statMRR" class="text-2xl font-black text-slate-950 font-mono">₹0</h3>
            <span class="text-xs font-extrabold text-slate-950 bg-krypton-neon px-2.5 py-0.5 rounded-full shadow-sm">Per Month</span>
          </div>
        </div>

        <div class="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
          <p class="text-xs font-semibold text-slate-500">Total Payments</p>
          <div class="flex items-baseline justify-between mt-2">
            <h3 id="statRevenue" class="text-2xl font-black text-slate-900 font-mono">₹0</h3>
            <span class="text-xs font-bold text-krypton-dark">Collected</span>
          </div>
        </div>

      </section>

      <!-- ACTIVE TABLE CONTAINER -->
      <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/50">
          <div class="flex items-center space-x-2">
            <span class="w-2.5 h-2.5 rounded-full bg-krypton-neon shadow-[0_0_8px_#00FF66]"></span>
            <h2 id="currentSectionTitle" class="text-sm font-bold text-slate-800">Clients</h2>
          </div>
          <span class="text-xs font-medium text-slate-400" id="recordCountLabel">0 Records</span>
        </div>

        <!-- Dynamic Render Target -->
        <div id="tabContentContainer" class="overflow-x-auto min-h-[350px]">
          <!-- Tables injected by app.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- ================= FORM MODAL ================= -->
  <div id="entryModal" class="fixed inset-0 z-50 bg-slate-900/30 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="w-full max-w-lg bg-white rounded-2xl p-6 shadow-2xl border border-slate-200 space-y-5 relative overflow-hidden">
      <div class="absolute top-0 left-0 right-0 h-1 bg-krypton-neon shadow-[0_0_10px_#00FF66]"></div>

      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="modalTitle" class="text-base font-bold text-slate-900">Add New Entry</h3>
        <button id="closeModalBtn" class="p-1 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="universalForm" class="space-y-4">
        <div id="formFieldsContainer" class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
          <!-- Form inputs loaded dynamically -->
        </div>
        <button type="submit" class="w-full py-3 bg-krypton-neon hover:bg-krypton-hover text-slate-950 font-bold rounded-xl text-sm transition krypton-glow active:scale-[0.98]">
          Save Record
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
