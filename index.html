<!-- ================= AUTHENTICATION OVERLAY ================= -->
  <div id="authScreen" style="display: flex;" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-md items-center justify-center p-4">
    <div class="bg-white/95 backdrop-blur-2xl border border-krypton-border/80 w-full max-w-md rounded-3xl p-8 shadow-2xl relative">
      <div class="flex items-center space-x-3.5 mb-6">
        <div class="w-14 h-14 rounded-2xl krypton-logo-badge p-1.5 flex items-center justify-center shadow-sm overflow-hidden flex-shrink-0">
          <img src="./25535.png" onerror="this.onerror=null; this.src='./logo.png';" alt="Krypton Logo" class="w-full h-full object-contain drop-shadow">
        </div>
        <div>
          <h2 class="text-xl font-extrabold tracking-tight text-slate-900 flex items-center gap-1.5">
            KRYPTON
          </h2>
          <p class="text-[10px] font-bold text-krypton-dark uppercase tracking-widest">The Best At What We Do.</p>
        </div>
      </div>

      <div class="mb-5">
        <h3 class="text-base font-bold text-slate-800">Admin Authentication</h3>
        <p class="text-xs text-slate-600 mt-0.5">Enter authorized agency credentials to access workspace.</p>
      </div>

      <!-- NO FORM TAG = ZERO PAGE REFRESH -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Admin Email</label>
          <input type="email" id="authEmail" required placeholder="admin@krypton.com" class="w-full bg-slate-50/90 border border-slate-300 text-xs px-3.5 py-2.5 rounded-xl outline-none krypton-input transition text-slate-900 placeholder-slate-400">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
          <input type="password" id="authPass" required placeholder="••••••••••••" class="w-full bg-slate-50/90 border border-slate-300 text-xs px-3.5 py-2.5 rounded-xl outline-none krypton-input transition text-slate-900 placeholder-slate-400">
        </div>
        <p id="authError" class="text-xs font-semibold text-rose-600 hidden bg-rose-50 p-2.5 rounded-xl border border-rose-200"></p>
        <button type="button" id="loginSubmitBtn" class="w-full py-2.5 krypton-glow-btn text-white font-bold text-xs rounded-xl transition shadow-md active:scale-[0.99] cursor-pointer">
          Unlock Operations Hub
        </button>
      </div>
    </div>
  </div>
